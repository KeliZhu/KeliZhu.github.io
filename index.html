<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>带按钮和选择框的网页</title>
    <style>
        body{font-size:20px;padding:30px}
        button,select{padding:8px 16px;font-size:18px;margin:10px;}
    </style>
</head>
<body>
    <h1>交互测试页面</h1>

    <!-- 下拉选择框 -->
    <select id="mySelect">
        <option value="game">游戏</option>
        <option value="study">学习</option>
        <option value="music">音乐</option>
    </select>

    <!-- 按钮 -->
    <button onclick="showResult()">点我确认选择</button>

    <p id="output"></p>

    <script>
        function showResult(){
            // 获取下拉框选中的值
            const choose = document.getElementById("mySelect").value;
            let text;
            if(choose === "game") text = "你选了游戏";
            else if(choose === "study") text = "你选了学习";
            else text = "你选了音乐";
            document.getElementById("output").innerText = text;
        }
    </script>
</body>
</html>
